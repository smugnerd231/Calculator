<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Калькулятор панелей</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function PanelCalculator() {
      const panelTypes = {
        "Заливка": {
          formula: (area) => {
            if (area < 0.15) return 75;
            if (area < 0.5) return area * 500;
            if (area < 1) return 130;
            return area * 130;
          },
          extras: [
            { name: "Цифровая печать", percent: 0.15 },
            { name: "Скотч (50€/м²)", flat: 50 },
          ],
        },

        "Kromex": {
          formula: (area) => {
            const a = Math.max(area, 0.2);
            return a <= 0.5 ? a * 10000 * 0.2 : (1250 * a + 200) * 1.2;
          },
          extras: [
            { name: "Цифровая печать", percent: 0.15 },
            { name: "Скотч (50€/м²)", flat: 50 },
            { name: "2D", flat: 200 },
            { name: "3D", flat: 250 },
          ],
        },

        "EcoDomes": {
          formula: (area) => {
            const a = Math.max(area, 0.2);
            return a <= 0.5 ? a * 10000 * 0.15 : 850 * a + 150;
          },
          extras: [
            { name: "Цифровая печать", percent: 0.15 },
            { name: "Скотч (50€/м²)", flat: 50 },
            { name: "Эффект купола", percent: 0.2 },
          ],
        },

        "Самоклеющиеся панели": {
          formula: (area) => 150 * area + 150,
          extras: [
            {
              name: "Пуклевочный штамп",
              custom: (onePanelArea) => {
                if (onePanelArea < 0.01) return 80;
                if (onePanelArea < 0.02) return 100;
                return 130;
              },
            },
          ],
        },

        "Гибкие клавиатуры": {
          // Возвращаем отдельные значения
          formula: (area, inputs) => {
            const onePanelArea = area / (inputs.qty || 1);

            // Подготовительные работы
            const prepBase = 296;
            const punchButtons =
              onePanelArea < 0.01
                ? 80
                : onePanelArea < 0.2
                ? 100
                : 150;
            const ledStamp = inputs.hasLedStamp ? 50 : 0;
            const buttonCost = (inputs.buttons || 0) * 5;
            const prepTotal = prepBase + punchButtons + ledStamp + buttonCost;

            // Изготовление
            const fabricationBase = 300 * area + 200;
            const membraneCost = (inputs.membranes || 0) * 0.25;
            const ledCost = (inputs.leds || 0) * 1;
            const fabricationTotal = fabricationBase + membraneCost + ledCost;

            // Общая сумма
            const total = prepTotal + fabricationTotal;

            return { prepTotal, fabricationTotal, total };
          },
          extras: [],
        },
      };

      const [tech, setTech] = useState("Kromex");
      const [panelCount, setPanelCount] = useState(1);
      const [panels, setPanels] = useState([
        {
          width: "",
          height: "",
          qty: "",
          extras: [],
          buttons: "",
          leds: "",
          membranes: "",
          hasLedStamp: false,
        },
      ]);

      const handlePanelChange = (index, field, value) => {
        const updated = [...panels];
        updated[index] = { ...updated[index], [field]: value };
        setPanels(updated);
      };

      const handleExtraToggle = (panelIndex, extraName) => {
        const updated = [...panels];
        const extras = new Set(updated[panelIndex].extras);
        extras.has(extraName) ? extras.delete(extraName) : extras.add(extraName);
        updated[panelIndex].extras = Array.from(extras);
        setPanels(updated);
      };

      const changePanelCount = (count) => {
        setPanelCount(count);
        setPanels(
          Array(count)
            .fill()
            .map(() => ({
              width: "",
              height: "",
              qty: "",
              extras: [],
              buttons: "",
              leds: "",
              membranes: "",
              hasLedStamp: false,
            }))
        );
      };

      const clearAll = () => {
        setPanelCount(1);
        setPanels([
          {
            width: "",
            height: "",
            qty: "",
            extras: [],
            buttons: "",
            leds: "",
            membranes: "",
            hasLedStamp: false,
          },
        ]);
      };

      const calculatePanelPrice = (panel) => {
        const { formula, extras } = panelTypes[tech];
        const width = parseFloat(panel.width) || 0;
        const height = parseFloat(panel.height) || 0;
        const qty = parseFloat(panel.qty) || 0;
        const onePanelArea = (width / 1000) * (height / 1000);
        const totalArea = onePanelArea * qty;

        if (totalArea <= 0) return { prep: 0, fab: 0, total: 0 };

        if (tech === "Гибкие клавиатуры") {
          return formula(totalArea, {
            qty,
            buttons: parseFloat(panel.buttons) || 0,
            leds: parseFloat(panel.leds) || 0,
            membranes: parseFloat(panel.membranes) || 0,
            hasLedStamp: panel.hasLedStamp,
          });
        }

        let cost = formula(totalArea);

        panel.extras.forEach((extraName) => {
          const extra = extras.find((e) => e.name === extraName);
          if (extra) {
            if (extra.percent) cost += cost * extra.percent;
            if (extra.flat) cost += totalArea * extra.flat;
            if (extra.custom) cost += extra.custom(onePanelArea);
          }
        });

        return { prep: 0, fab: 0, total: cost };
      };

      const calculateTotal = () => {
        return panels.reduce(
          (sum, p) => sum + calculatePanelPrice(p).total,
          0
        );
      };

      return (
        <div className="p-6 max-w-5xl mx-auto bg-gray-100 min-h-screen">
          <h1 className="text-3xl font-bold mb-6 text-center">Калькулятор панелей</h1>

          <div className="mb-6 flex flex-col sm:flex-row gap-4 justify-center">
            <div>
              <label className="font-semibold mr-2">Технология:</label>
              <select
                value={tech}
                onChange={(e) => setTech(e.target.value)}
                className="border rounded p-2"
              >
                {Object.keys(panelTypes).map((t) => (
                  <option key={t} value={t}>
                    {t}
                  </option>
                ))}
              </select>
            </div>

            <div>
              <label className="font-semibold mr-2">Количество панелей:</label>
              <select
                value={panelCount}
                onChange={(e) => changePanelCount(parseInt(e.target.value))}
                className="border rounded p-2"
              >
                {[1, 2, 3, 4, 5].map((n) => (
                  <option key={n} value={n}>
                    {n}
                  </option>
                ))}
              </select>
            </div>

            <button
              onClick={clearAll}
              className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition"
            >
              Очистить всё
            </button>
          </div>

          {panels.map((panel, i) => {
            const onePanelArea =
              ((parseFloat(panel.width) || 0) / 1000) *
              ((parseFloat(panel.height) || 0) / 1000);
            const totalArea = onePanelArea * (parseFloat(panel.qty) || 0);
            const { prepTotal, fabricationTotal,total } =
              calculatePanelPrice(panel);

            return (
              <div key={i} className="bg-white p-4 rounded-2xl shadow mb-4">
                <h2 className="text-xl font-semibold mb-3">Панель {i + 1}</h2>
                <div className="grid grid-cols-3 gap-3 mb-4">
                  <input
                    type="number"
                    placeholder="Длина (мм)"
                    value={panel.width}
                    onChange={(e) =>
                      handlePanelChange(i, "width", e.target.value)
                    }
                    className="border p-2 rounded"
                  />
                  <input
                    type="number"
                    placeholder="Ширина (мм)"
                    value={panel.height}
                    onChange={(e) =>
                      handlePanelChange(i, "height", e.target.value)
                    }
                    className="border p-2 rounded"
                  />
                  <input
                    type="number"
                    placeholder="Кол-во"
                    value={panel.qty}
                    onChange={(e) => handlePanelChange(i, "qty", e.target.value)}
                    className="border p-2 rounded"
                  />
                </div>

                {tech === "Гибкие клавиатуры" && (
                  <div className="grid grid-cols-3 gap-3 mb-4">
                    <input
                      type="number"
                      placeholder="Кнопки"
                      value={panel.buttons}
                      onChange={(e) =>
                        handlePanelChange(i, "buttons", e.target.value)
                      }
                      className="border p-2 rounded"
                    />
                    <input
                      type="number"
                      placeholder="Светодиоды"
                      value={panel.leds}
                      onChange={(e) =>
                        handlePanelChange(i, "leds", e.target.value)
                      }
                      className="border p-2 rounded"
                    />
                    <input
                      type="number"
                      placeholder="Мембраны"
                      value={panel.membranes}
                      onChange={(e) =>
                        handlePanelChange(i, "membranes", e.target.value)
                      }
                      className="border p-2 rounded"
                    />
                    <label className="flex items-center gap-2 col-span-3">
                      <input
                        type="checkbox"
                        checked={panel.hasLedStamp}
                        onChange={(e) =>
                          handlePanelChange(i, "hasLedStamp", e.target.checked)
                        }
                      />
                      Пуклевочный штамп для светодиодов
                    </label>
                  </div>
                )}

                {panelTypes[tech].extras.length > 0 && (
                  <div className="flex flex-wrap gap-3 mb-2">
                    {panelTypes[tech].extras.map((extra) => (
                      <label
                        key={extra.name}
                        className={`flex items-center gap-1 p-1 rounded ${
                          panel.extras.includes(extra.name) ? "bg-blue-100" : ""
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={panel.extras.includes(extra.name)}
                          onChange={() => handleExtraToggle(i, extra.name)}
                        />
                        {extra.name}
                      </label>
                    ))}
                  </div>
                )}

                <div className="text-sm text-gray-600 mb-2">
                  Площадь одной панели: {onePanelArea.toFixed(4)} м² |
                  Общая площадь: {totalArea.toFixed(4)} м²
                </div>

                {tech === "Гибкие клавиатуры" ? (
                  <div className="space-y-1">
                    <div>Подготовительные работы: <b>{prepTotal?.toFixed(2)} €</b></div>
                    <div>Изготовление: <b>{fabricationTotal?.toFixed(2)} €</b></div>
                    <div className="font-semibold text-lg mt-1">
                      Итого: {total?.toFixed(2)} €
                    </div>
                  </div>
                ) : (
                  <div className="font-semibold mt-2">
                    Стоимость панели: {total?.toFixed(2)} €
                  </div>
                )}
              </div>
            );
          })}

          <div className="mt-6 p-4 bg-white rounded-2xl shadow text-2xl font-bold text-center">
            Общая стоимость: {calculateTotal().toFixed(2)} €
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PanelCalculator />);
  </script>
</body>
</html>
